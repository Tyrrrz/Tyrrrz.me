name: main

on:
  workflow_dispatch:
  push:
    branches:
      - prime
  pull_request:
    branches:
      - prime
  schedule:
    # Rebuild nightly to refresh dynamic data (project stats, donation info, etc.)
    - cron: "0 0 * * *"

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm run format:check

      - name: Perform linting
        run: pnpm run lint:check

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install NodeJS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - name: Install pnpm
        run: npm install --global --allow-scripts=pnpm pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          BUILD_ID: ${{ github.sha }}
          SITE_URL: ${{ steps.configure-pages.outputs.base_url }}
          GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN }}
          GOATCOUNTER_URL: ${{ secrets.GOATCOUNTER_URL }}
          PATREON_TOKEN: ${{ secrets.PATREON_TOKEN }}
          BUYMEACOFFEE_TOKEN: ${{ secrets.BUYMEACOFFEE_TOKEN }}
          PRIVATE_DONORS: ${{ secrets.PRIVATE_DONORS }}
        run: pnpm build

      - name: Upload GitHub Pages assets
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    if: ${{ github.event_name != 'pull_request' }}

    needs:
      - format
      - pack

    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
